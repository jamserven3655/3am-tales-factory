name: nightly-short
on:
  schedule: [{cron: "0 20 * * *"}]   # 3 PM ET (EST)
  workflow_dispatch:
    inputs: {story_id: {description: "optional story id", required: false}}
permissions: {contents: write, pages: write}
concurrency: {group: factory}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout (no marketplace actions allowed)
        run: |
          git clone -q --depth 1 "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" src
          shopt -s dotglob; cp -r src/* . ; rm -rf src
          git clone -q --depth 1 -b gh-pages "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" site || mkdir -p site
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core espeak-ng >/dev/null
      - run: python3 -m pip install -q kokoro-onnx soundfile numpy
      - run: |
          mkdir -p models; cd models
          curl -sSLO https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
          curl -sSLO https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
      - run: python3 stats.py
        env: {YOUTUBE_API_KEY: "${{ secrets.YOUTUBE_API_KEY }}"}
      - run: python3 factory.py site && python3 site.py site
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          STORY_ID: ${{ github.event.inputs.story_id }}
      - name: publish (single-commit gh-pages, keeps repo small)
        run: |
          cp stats.json site/ 2>/dev/null || true
          cd site && rm -rf .git && git init -q -b gh-pages && touch .nojekyll
          git config user.name factory && git config user.email factory@users.noreply.github.com
          git add -A && git commit -qm "publish $(date -u +%F)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
