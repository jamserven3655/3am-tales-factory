name: nightly-short
on:
  schedule: [{cron: "0 20 * * *"}]   # 3 PM ET (EST)
  workflow_dispatch:
    inputs: {story_id: {description: "optional story id", required: false}}
permissions: {contents: write, pages: write}
concurrency: {group: factory}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: {ref: gh-pages, path: site}
        continue-on-error: true
      - run: mkdir -p site && sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core espeak-ng >/dev/null
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -q kokoro-onnx soundfile numpy
      - uses: actions/cache@v4
        with: {path: models, key: kokoro-v1.0}
      - run: |
          mkdir -p models; cd models
          [ -f kokoro-v1.0.onnx ] || curl -sSLO https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
          [ -f voices-v1.0.bin ] || curl -sSLO https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
      - run: python stats.py
        env: {YOUTUBE_API_KEY: "${{ secrets.YOUTUBE_API_KEY }}"}
      - run: python factory.py site && python site.py site
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          STORY_ID: ${{ github.event.inputs.story_id }}
      - name: publish (single-commit gh-pages, keeps repo small)
        run: |
          cp stats.json site/ 2>/dev/null || true
          cd site && rm -rf .git && git init -q -b gh-pages && touch .nojekyll
          git config user.name factory && git config user.email factory@users.noreply.github.com
          git add -A && git commit -qm "publish $(date -u +%F)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
